[package]
name = "ternary-contours-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
description = "Repository CLI for validating and plotting tabulated ternary liquidus fields"

[[bin]]
name = "ternary-contours-cli"
path = "src/main.rs"

[features]
default = []
viewer = ["dep:eframe", "dep:egui"]

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"], optional = true }
egui = { version = "0.33", optional = true }
plotters = { version = "0.3.7", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "svg_backend",
    "ttf",
] }
plotters-ternary = { path = "../../../plotters-ternary", features = ["stable-contours"] }
ternary-contours = { path = "../..", features = ["irregular-delaunay"] }
thiserror = "2.0.17"
