[package]
name = "ternary-contours-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
description = "Repository CLI for validating and plotting tabulated ternary liquidus fields"

[[bin]]
name = "ternary-contours-cli"
path = "src/main.rs"

[features]
default = []
inspection = ["ternary-contours/cubic-alpha"]
viewer = ["dep:eframe", "dep:egui", "dep:rfd", "inspection"]
trace = ["inspection", "dep:serde_json", "ternary-contours/numerical-trace-serde"]

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"], optional = true }
egui = { version = "0.33", optional = true }
rfd = { version = "0.17", optional = true }
plotters = { version = "0.3.7", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "svg_backend",
    "ttf",
] }
plotters-ternary = { path = "../../../plotters-ternary", features = ["stable-contours"] }
ternary-contours = { path = "../..", features = ["irregular-delaunay", "cubic-alpha"] }
ternary-contours-gui-core = { path = "../ternary-contours-gui-core" }
thiserror = "2.0.17"
serde_json = { version = "1.0.145", optional = true }
