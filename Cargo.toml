[package]
name = "ternary-contours"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Backend-independent fields, contours, stable phases, and filled bands for ternary meshes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/evnekdev/ternary-contours"
homepage = "https://github.com/evnekdev/ternary-contours"
documentation = "https://docs.rs/ternary-contours"
readme = "README.md"
keywords = ["ternary", "contours", "interpolation", "scientific", "numerical"]
categories = ["science", "mathematics"]
exclude = [
    ".github/**",
    "*.zip",
    "target/**",
    ".codex/**",
    "kb-audit-temp/**",
    "proptest-regressions/**",
    "temp/**",
    "tmp/**",
]

[workspace]
members = [
    "tools/ternary-contours-cli",
    "tools/ternary-contours-gui-core",
]
resolver = "3"

[features]
default = []
cubic-alpha = ["dep:spline1d"]
irregular-delaunay = ["dep:delaunay"]
irregular-cubic-alpha = ["irregular-delaunay", "cubic-alpha"]

[dependencies]
delaunay = { version = "0.8.0", optional = true }
spline1d = { version = "0.1.0", default-features = false, features = ["alloc"], optional = true }

[[example]]
name = "interpolate_irregular_field"
required-features = ["irregular-delaunay"]

[[example]]
name = "irregular_metrics"
required-features = ["irregular-delaunay"]

[[example]]
name = "interpolate_irregular_cubic_field"
required-features = ["irregular-cubic-alpha"]

[[example]]
name = "irregular_contours"
required-features = ["irregular-cubic-alpha"]

[[example]]
name = "stable_phase_contours"
required-features = ["irregular-delaunay"]
